        - /usr/bin/env sh .sqa/script.aqua_open_condor.sh
        container: qc.sty_clove_loyal_boa
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-mon-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.pink_jubilant_mongoose.sh
        container: qc.uni_byzantium_diligent_coyote
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-mon-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.chocolate_skeptical_gibbon.sh
        container: qc.ver_isabelline_enigmatic_skunk
