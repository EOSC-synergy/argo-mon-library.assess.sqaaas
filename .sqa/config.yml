        - /usr/bin/env sh .sqa/script.porcelain_practical_tarantula.sh
        container: qc.doc_thistle_adaptable_cougar
      github.com/ARGOeu/argo-mon-library git:
        commands:
        - /usr/bin/env sh .sqa/script.boysenberry_blissful_lynx.sh
        container: qc.doc_cadet_outgoing_dragonfly
      github.com/ARGOeu/argo-mon-library markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_careful_koala.sh
        container: qc.doc_sand_innocent_cassowary
