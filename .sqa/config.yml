      github.com/ARGOeu/argo-mon-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.navy_reserved_squirrel.sh
        container: qc.sty_walnut_logical_kiwi
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-mon-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.violet_focused_axolotl.sh
        container: qc.uni_champagne_jubilant_skunk
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-mon-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.copper_sympathetic_dugong.sh
        container: qc.ver_purple_shrewd_seal
