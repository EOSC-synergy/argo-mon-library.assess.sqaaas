      github.com/ARGOeu/argo-mon-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.aquamarine_joyful_finch.sh
        container: qc.sty_navy_artistic_bear
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-mon-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.onyx_gracious_unicorn.sh
        container: qc.uni_gold_proud_turkey
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-mon-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.periwinkle_radiant_tapir.sh
        container: qc.ver_butter_confused_roc
